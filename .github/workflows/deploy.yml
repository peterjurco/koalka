name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Deploy via SFTP
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PASS: ${{ secrets.SFTP_PASS }}
        run: |
          sudo apt-get install -y sshpass
          python3 - <<'EOF'
          import os, pathlib, subprocess, sys

          host        = os.environ['SFTP_HOST']
          user        = os.environ['SFTP_USER']
          password    = os.environ['SFTP_PASS']
          local_base = pathlib.Path('dist')

          # Collect unique dirs (shallowest first) and all put commands
          # SFTP chroot is the koalka dir itself, so remote root is /
          dirs = []
          puts = []
          seen_dirs = set()

          def collect(local_path, remote_path):
              if remote_path and remote_path not in seen_dirs:
                  dirs.append(remote_path)
                  seen_dirs.add(remote_path)
              for item in sorted(local_path.iterdir()):
                  r = f"{remote_path}/{item.name}"
                  if item.is_dir():
                      collect(item, r)
                  else:
                      puts.append(f'put {item} {r}')

          collect(local_base, '')

          # Create dirs first (without -, so errors are visible), then upload files
          mkdir_cmds = '\n'.join(f'mkdir {d}' for d in dirs)
          put_cmds   = '\n'.join(puts)
          print(f"Creating {len(dirs)} dirs, uploading {len(puts)} files")

          env = dict(os.environ, SSHPASS=password)

          # mkdir pass: ignore non-zero exit (dirs may already exist)
          subprocess.run(
              ['sshpass', '-e', 'sftp', '-o', 'StrictHostKeyChecking=no', f'{user}@{host}'],
              input=mkdir_cmds, text=True, env=env,
          )

          # upload pass: fail on error
          result = subprocess.run(
              ['sshpass', '-e', 'sftp', '-o', 'StrictHostKeyChecking=no', f'{user}@{host}'],
              input=put_cmds, text=True, env=env,
          )
          sys.exit(result.returncode)
          EOF
