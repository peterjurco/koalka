name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Deploy via SFTP
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SSHPASS: ${{ secrets.SFTP_PASS }}
        run: |
          sudo apt-get install -y lftp sshpass
          lftp -u "$SFTP_USER,placeholder" "sftp://$SFTP_HOST" <<'LFTP'
          set sftp:connect-program "sshpass -e ssh -a -x -o StrictHostKeyChecking=no"
          mirror --reverse --delete --verbose dist/ /peterjur.co/web/koalka/
          bye
          LFTP
