name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Deploy via SFTP
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PASS: ${{ secrets.SFTP_PASS }}
        run: |
          sudo apt-get install -y sshpass
          python3 - <<'EOF'
          import os, pathlib, subprocess, sys

          host        = os.environ['SFTP_HOST']
          user        = os.environ['SFTP_USER']
          password    = os.environ['SFTP_PASS']
          remote_base = '/peterjur.co/web/koalka'
          local_base  = pathlib.Path('dist')

          lines = []
          def build_commands(local_path, remote_path):
              lines.append(f'-mkdir {remote_path}')
              for item in sorted(local_path.iterdir()):
                  r = f"{remote_path}/{item.name}"
                  if item.is_dir():
                      build_commands(item, r)
                  else:
                      lines.append(f'put {item} {r}')

          build_commands(local_base, remote_base)
          print(f"Queued {len(lines)} sftp commands")

          with tempfile.NamedTemporaryFile(mode='w', suffix='.sftp', delete=False) as f:
              f.write('\n'.join(lines) + '\n')
              batch_file = f.name

          env = dict(os.environ, SSHPASS=password)
          result = subprocess.run(
              ['sshpass', '-e', 'sftp',
               '-o', 'StrictHostKeyChecking=no',
               f'{user}@{host}'],
              input='\n'.join(lines),
              text=True,
              env=env,
          )
          sys.exit(result.returncode)
          EOF
